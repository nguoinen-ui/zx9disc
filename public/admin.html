<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin DISC</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Admin Panel</h1>
            <p class="subhead">Quản lý kết quả DISC</p>
        </div>

        <!-- Login -->
        <div id="loginForm" class="card">
            <div class="form-group">
                <label>🔑 Nhập mật khẩu admin</label>
                <input type="password" id="adminPassword" placeholder="Mật khẩu..." onkeypress="if(event.key==='Enter') login()">
                <button onclick="login()" class="btn-primary">Đăng nhập</button>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboard" style="display: none;">
            <div class="stats-grid" id="statsGrid">
                <div class="stat-card"><span class="stat-number" id="totalUsers">0</span><span class="stat-label">Tổng người</span></div>
                <div class="stat-card"><span class="stat-number" id="avgD">0</span><span class="stat-label">D trung bình</span></div>
                <div class="stat-card"><span class="stat-number" id="avgI">0</span><span class="stat-label">I trung bình</span></div>
                <div class="stat-card"><span class="stat-number" id="avgS">0</span><span class="stat-label">S trung bình</span></div>
                <div class="stat-card"><span class="stat-number" id="avgC">0</span><span class="stat-label">C trung bình</span></div>
            </div>

            <div class="admin-actions">
                <button onclick="refreshData()" class="btn-secondary">🔄 Làm mới</button>
                <button onclick="exportCSV()" class="btn-secondary">📥 Xuất Excel</button>
                <button onclick="logout()" class="btn-secondary">🚪 Đăng xuất</button>
            </div>

            <div class="card">
                <h2>📋 Danh sách kết quả</h2>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm theo tên..." oninput="filterResults()">
                </div>
                <div id="resultsList" class="results-grid"></div>
            </div>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>
</html>
